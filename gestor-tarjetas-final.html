                '<div class="card-detail-logo">' + this.getCardLogo(this.detailCard.type) + '</div>' +
                '<div class="detail-top-info">' +
                    '<div class="card-detail-title">' + this.detailCard.name + '</div>' +
                    '<div class="card-detail-subtitle">•••• ' + this.detailCard.number + '</div>' +
                '</div>' +
                addBtn +
            '</div>' +
            '<div class="period-row">' +
                '<button class="period-btn" onclick="app.changePeriod(-1)">‹</button>' +
                '<div class="period-center">' +
                    '<div class="period-dates">' + fd(period.startDate) + ' — ' + fd(period.endDate) + '</div>' +
                    '<div class="period-status ' + period.status + '">' + sl[period.status] + '</div>' +
                '</div>' +
                '<button class="period-btn" onclick="app.changePeriod(1)">›</button>' +
            '</div>' +
            '<div style="margin-bottom:12px"><div class="stat-item" style="text-align:center"><div class="stat-label">Total</div><div class="stat-value" style="font-size:1.6rem">' + this.formatCurrency(totalSpent) + '</div></div></div>' +
            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
                '<div class="stat-item" style="text-align:center"><div class="stat-label">Cierre</div><div class="stat-value sm">' + fd(period.endDate) + '</div></div>' +
                '<div class="stat-item" style="text-align:center"><div class="stat-label">Vence</div><div class="stat-value sm">' + fd(period.dueDate) + '</div></div>' +
            '</div>' +
        '</div>' +
        '<div class="expenses-header"><span class="expenses-title">Consumos</span></div>' +
        listHtml;
    },

    renderCards() {
        const container = document.getElementById('cards-container');
        
        if (this.cards.length === 0) {
            container.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-icon">💳</div><p>No tienes tarjetas agregadas</p></div>';
            return;
        }

        container.innerHTML = this.cards.map(card => {
            const currentPeriod = this.getPeriod(card, 0);
            const currentExpenses = this.getPeriodExpenses(card, currentPeriod);
            const currentTotal = currentExpenses.reduce((sum, exp) => sum + exp.amount, 0);
            
            const closeDate = new Date(card.closeDate + 'T00:00:00');
            const dueDate = new Date(card.dueDate + 'T00:00:00');
            
            return '<div class="card" onclick="app.openCardDetail(' + card.id + ')">' +
                '<div class="card-logo">' + this.getCardLogo(card.type) + '</div>' +
                '<div class="card-info">' +
                    '<div class="card-name">' + card.name + '</div>' +
                    '<div class="card-number">•••• ' + card.number + '</div>' +
                '</div>' +
                '<div class="card-meta">' +
                    '<div class="total-amount">' + this.formatCurrency(currentTotal) + '</div>' +
                    '<div class="card-due">Cierra ' + closeDate.getDate() + '/' + (closeDate.getMonth() + 1) + ' · Vence ' + dueDate.getDate() + '/' + (dueDate.getMonth() + 1) + '</div>' +
                '</div>' +
                '<div class="card-actions">' +
                    '<button class="icon-btn" onclick="event.stopPropagation();app.openCardModal(app.cards.find(c=>c.id===' + card.id + '))">✏️</button>' +
                    '<button class="icon-btn delete" onclick="event.stopPropagation();app.deleteCard(' + card.id + ')">🗑️</button>' +
                '</div>' +
            '</div>';
        }).join('');
    },

    renderExpenses() {
        const container = document.getElementById('expenses-container');
        
        if (this.cards.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">💳</div><p>No tienes tarjetas agregadas</p></div>';
            return;
        }

        container.innerHTML = this.cards.map(card => {
            const catEmoji = {
                super: '🛒',
                comida: '🍔',
                transporte: '🚗',
                salud: '💊',
                entretenimiento: '🎬',
                ropa: '👗',
                servicios: '💡',
                otro: '📦'
            };
            
            const getCatInfo = (cat) => {
                if (this.customCategories[cat]) {
                    const c = this.customCategories[cat];
                    const colors = c.color.split('-');
                    return {
                        emoji: c.emoji,
                        name: c.name,
                        bg: colors[0],
                        text: colors[1]
                    };
                }
                
                const defaults = {
                    super: { bg: '#d1fae5', text: '#065f46' },
                    comida: { bg: '#fef3c7', text: '#92400e' },
                    transporte: { bg: '#dbeafe', text: '#1e40af' },
                    salud: { bg: '#fce7f3', text: '#9d174d' },
                    entretenimiento: { bg: '#ede9fe', text: '#5b21b6' },
                    ropa: { bg: '#ffedd5', text: '#9a3412' },
                    servicios: { bg: '#e0f2fe', text: '#075985' },
                    otro: { bg: '#f3f4f6', text: '#4b5563' }
                };
                
                const d = defaults[cat] || defaults.otro;
                return {
                    emoji: catEmoji[cat] || '📦',
                    name: cat,
                    bg: d.bg,
                    text: d.text
                };
            };
            
            return '<div style="margin-bottom:36px">' +
                '<h3 class="expenses-title">' + card.name + '</h3>' +
                (card.expenses.length === 0 ?
                    '<div class="empty-state"><p>No hay consumos registrados</p></div>' :
                    '<div class="expenses-list">' +
                        card.expenses.map(expense => {
                            const cat = expense.category || 'otro';
                            const info = getCatInfo(cat);
                            const badge = '<span class="expense-cat" style="background:' + info.bg + ';color:' + info.text + '">' + info.emoji + ' ' + info.name + '</span>';
                            
                            return '<div class="expense-item">' +
                                '<div class="expense-info">' +
                                    '<h4>' + expense.name + '</h4>' +
                                    '<p>' + this.formatDate(expense.date) + '</p>' +
                                    badge +
                                '</div>' +
                                '<div class="expense-right">' +
                                    '<div class="expense-amount">' + this.formatCurrency(expense.totalAmount) + '</div>' +
                                    (expense.installments > 1 ? '<span class="installments-badge">' + expense.installments + 'x</span>' : '') +
                                    '<button class="icon-btn delete" onclick="app.deleteExpense(' + card.id + ',' + expense.id + ')">🗑️</button>' +
                                '</div>' +
                            '</div>';
                        }).join('') +
                    '</div>'
                ) +
            '</div>';
        }).join('');
    },

    render() {
        if (this.detailCard) {
            this.renderCardDetail();
        } else if (this.currentTab === 'tarjetas') {
            this.renderCards();
        } else {
            this.renderExpenses();
        }
    },

    openQuickExpenseModal() {
        console.log('🔍 openQuickExpenseModal llamado');
        console.log('📊 Número de tarjetas:', this.cards.length);
        
        // Si no hay tarjetas, mostrar mensaje
        if (this.cards.length === 0) {
            alert('⚠️ Primero debes crear una tarjeta');
            return;
        }
        
        // Si solo hay 1 tarjeta, abrir directamente el modal de consumo
        if (this.cards.length === 1) {
            console.log('✅ Abriendo modal para tarjeta única');
            this.openExpenseModal(this.cards[0]);
            return;
        }
        
        // Si hay múltiples tarjetas, mostrar selector
        console.log('📋 Mostrando selector de tarjetas');
        this.renderCardSelector();
        document.getElementById('card-selector-modal').classList.add('active');
    },

    renderCardSelector() {
        const container = document.getElementById('card-selector-list');
        const logos = { visa: '💳', mastercard: '💳', amex: '💳', naranja: '🍊', cabal: '💳' };
        
        container.innerHTML = this.cards.map(card => {
            const logo = logos[card.type] || '💳';
            return `
                <div class="card-selector-item" onclick="app.selectCardForExpense(${card.id})">
                    <div class="card-selector-logo">${logo}</div>
                    <div class="card-selector-info">
                        <div class="card-selector-name">${card.name}</div>
                        <div class="card-selector-number">•••• ${card.number}</div>
                    </div>
                </div>
            `;
        }).join('');
    },

    selectCardForExpense(cardId) {
        const card = this.cards.find(c => c.id === cardId);
        if (card) {
            // Cerrar modal de selector
            document.getElementById('card-selector-modal').classList.remove('active');

            // Abrir modal de consumo para esta tarjeta
            this.openExpenseModal(card);
        }
    },

    // ============================================
    // Menú desplegable + Export / Import de datos
    // ============================================

    toggleMenu(ev) {
        if (ev) ev.stopPropagation();
        const menu = document.getElementById('actions-menu');
        const isHidden = menu.classList.contains('hidden');
        menu.classList.toggle('hidden');

        // Cerrar el menú al clickear fuera
        if (isHidden) {
            const closeOnClickOutside = (e) => {
                if (!menu.contains(e.target) && e.target.id !== 'menu-btn') {
                    menu.classList.add('hidden');
                    document.removeEventListener('click', closeOnClickOutside);
                }
            };
            // Defer para que el click actual no lo cierre
            setTimeout(() => document.addEventListener('click', closeOnClickOutside), 0);
        }
    },

    exportData() {
        try {
            const payload = {
                version: 1,
                exportedAt: new Date().toISOString(),
                cards: this.cards,
                customCategories: this.customCategories
            };
            const json = JSON.stringify(payload, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            const date = new Date().toISOString().split('T')[0];
            a.download = `mis-tarjetas-backup-${date}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            document.getElementById('actions-menu').classList.add('hidden');
            alert('✅ Backup descargado correctamente');
        } catch (e) {
            console.error('Error exportando:', e);
            alert('❌ Error al exportar los datos: ' + e.message);
        }
    },

    importData(ev) {
        const file = ev.target.files && ev.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);

                // Validar estructura mínima
                if (!data || !Array.isArray(data.cards)) {
                    alert('❌ Archivo inválido. Debe contener al menos un array "cards".');
                    return;
                }

                const cardCount = data.cards.length;
                const catCount = data.customCategories ? Object.keys(data.customCategories).length : 0;

                const confirmMsg = `¿Reemplazar todos los datos actuales?\n\n` +
                    `Tarjetas: ${this.cards.length} → ${cardCount}\n` +
                    `Categorías personalizadas: ${Object.keys(this.customCategories).length} → ${catCount}\n\n` +
                    `Se sobrescribirán los datos actuales. Esta acción no se puede deshacer.`;

                if (!confirm(confirmMsg)) return;

                this.cards = data.cards;
                this.customCategories = data.customCategories || {};
                this.saveData();
                this.detailCard = null;
                this.render();

                document.getElementById('actions-menu').classList.add('hidden');
                alert('✅ Datos importados correctamente');
            } catch (err) {
                console.error('Error importando:', err);
                alert('❌ Error al leer el archivo: ' + err.message);
            } finally {
                // Limpiar el input para permitir re-importar el mismo archivo
                ev.target.value = '';
            }
        };
        reader.onerror = () => {
            alert('❌ No se pudo leer el archivo');
            ev.target.value = '';
        };
        reader.readAsText(file);
    }
};

document.addEventListener('DOMContentLoaded', () => {
    app.init();

    // Registrar Service Worker para PWA
    // Solo registra si estamos en HTTPS o localhost (requerimiento del navegador)
    // y si el archivo sw.js existe (evita errores ruidosos en consola).
    if ('serviceWorker' in navigator) {
        const isSecure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (isSecure) {
            // Ruta relativa al HTML actual para que funcione sin importar el subdirectorio
            // (Cloudflare Pages, Vercel, GitHub Pages todos lo soportan).
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { scope: './' })
                    .then(reg => {
                        console.log('[PWA] Service Worker registrado:', reg.scope);
                    })
                    .catch(err => {
                        // No bloquear la app si el SW falla; la app sigue funcionando online.
                        console.warn('[PWA] No se pudo registrar el Service Worker:', err.message);
                    });
            });
        } else {
            console.info('[PWA] SW deshabilitado (requiere HTTPS). Funciona en file:// pero sin caché offline.');
        }
    }
});
